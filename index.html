<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Veterinaria La Hacienda</title>
    <style>
        :root { --primary: #1a4d2e; --accent: #e8eddf; }
        body { font-family: sans-serif; text-align: center; color: #333; }
        .logo { max-width: 200px; margin: 20px 0; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; padding: 20px; }
        .gallery img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        .footer { background: var(--primary); color: white; padding: 40px; }
    </style>
</head>
<body>

    <img src="https://i.ibb.co/6P07p51/photo-6-2026-06-23-17-00-20-2.jpg" alt="Logo" class="logo">
    
    <h2>Nuestro Equipo y Servicios</h2>
    <div class="gallery">
        <img src="https://i.ibb.co/3kXyJ5b/photo-1-2026-06-23-17-00-20.jpg" alt="Equipo">
        <img src="https://i.ibb.co/F8S7g9x/photo-2-2026-06-23-17-00-20.jpg" alt="Servicio">
        <img src="https://i.ibb.co/bN1mK2s/photo-3-2026-06-23-17-00-20.jpg" alt="Consulta">
        <img src="https://i.ibb.co/L9vC8z4/photo-4-2026-06-23-17-00-20.jpg" alt="Equipo">
        <img src="https://i.ibb.co/m2P4w6r/photo-5-2026-06-23-17-00-20.jpg" alt="Examen">
        <img src="https://i.ibb.co/q8W5x9z/photo-7-2026-06-23-17-00-20.jpg" alt="Consulta">
    </div>

    <footer class="footer">
        <h2>¡Gracias por elegirnos!</h2>
        <p>Agradecemos profundamente que prefiera nuestros servicios para el cuidado y bienestar de su mascota.</p>
    </footer>

</body>
</html>
