<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria La Hacienda</title>
    <style>
        :root {
            --primary: #1a4d2e;
            --accent: #e8eddf;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; color: #333; line-height: 1.6; }
        header { padding: 40px; text-align: center; background: #fff; }
        .logo { max-width: 350px; height: auto; }
        
        .container { max-width: 900px; margin: auto; padding: 20px; }
        h2 { text-align: center; color: var(--primary); margin-bottom: 30px; }
        
        /* Galería optimizada */
        .gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
        }
        .gallery img { 
            width: 100%; 
            height: 300px; 
            object-fit: cover; 
            border-radius: 12px; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }
        .gallery img:hover { transform: scale(1.02); }

        footer { text-align: center; padding: 50px; background: var(--primary); color: white; margin-top: 50px; }
    </style>
</head>
<body>

<header>
    <img src="https://i.ibb.co/QjD8SFMy/photo-6-2026-06-23-17-00-20.jpg" alt="Logo La Hacienda" class="logo">
</header>

<div class="container">
    <h2>Nuestro Equipo en Acción</h2>
    <div class="gallery">
        <img src="https://i.ibb.co/b5DC0ctC/photo-1-2026-06-23-17-00-20.jpg" alt="Examen clínico">
        <img src="https://i.ibb.co/fVyP1swj/photo-4-2026-06-23-17-00-20.jpg" alt="Equipo médico">
        <img src="https://i.ibb.co/k2BKKJ1f/photo-5-2026-06-23-17-00-20.jpg" alt="Consulta especializada">
        <img src="https://i.ibb.co/q3HGNYkc/photo-7-2026-06-23-17-00-20.jpg" alt="Consulta felina">
    </div>
</div>

<footer>
    <h2>¡Gracias por elegirnos!</h2>
    <p>En Veterinaria La Hacienda, agradecemos que confíe en nuestros servicios profesionales para el cuidado de su mascota.</p>
</footer>

</body>
</html>
